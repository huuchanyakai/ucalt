<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YouTube</title>
    <meta
      name="description"
      content="YouTubeは、日本向けのYouTube匿名視聴サービスです。アカウント不要・広告なしで、プライバシーを守りながら音楽や動画を快適に再生できます。"
    />
    <meta
      name="keywords"
      content="YouTube 匿名視聴, プライバシー保護, Invidious 日本, 広告なし, 動画再生"
    />

    <meta property="og:title" content="YouTube｜YouTube匿名視聴サイト" />
    <meta
      property="og:description"
      content="YouTube動画を匿名で、広告なし・追跡なしで視聴。日本向け特化で音楽も再生可能。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="YouTube｜YouTube匿名視聴サイト" />
    <meta
      name="twitter:description"
      content="YouTube動画を安全・匿名で視聴。広告なし・ログなしで快適に再生できます。"
    />
    <link rel="icon" href="/favicon.ico" />

    <style>
      a {
        color: var(--link-color);
      }

      body {
        font-family: "ヒラギノ角ゴ ProN", "Hiragino Kaku Gothic ProN",
                     "メイリオ", Meiryo,
                     "ＭＳ ゴシック", "MS Gothic",
                     sans-serif;
        background-color: var(--bg-primary);
        color: var(--text-primary);
        margin: 0;
        line-height: 1.8;
        transition: background-color 0.3s ease, color 0.3s ease;
      }
    </style>
    <script type="application/ld+json">
      {
        "@type": "Website",
        "name": "YouTube",
        "description": "日本向けのYouTube匿名視聴サイト。広告なし・ログなしでプライバシーを守りながら音楽や動画を再生可能。",
        "inLanguage": "ja",
        "publisher": {
          "@type": "Organization",
          "name": "YouTube"
        }
      }
    </script>
  </head>

  <body>

    <div id="app"></div>

    <noscript>
      <h2>JavaScriptが無効です</h2>
      <p>YouTubeを利用するにはJavaScriptを有効にしてください。</p>
    </noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
